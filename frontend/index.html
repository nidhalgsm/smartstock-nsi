<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SmartStock TN</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=4"></head><body>
<div id="app"><div class="boot"><span class="spin"></span>Loading…</div></div>
<script>/* never a blank screen: show the error or a reload link */
window.addEventListener("error",function(e){var a=document.getElementById("app");if(a&&a.querySelector(".boot"))a.innerHTML='<div class="boot">Error: '+e.message+' <a href="">Reload</a></div>'});
setTimeout(function(){var a=document.getElementById("app");if(a&&a.querySelector(".boot"))a.innerHTML='<div class="boot">Still loading. <a href="">Reload</a></div>'},8000);</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>window.supabase||document.write('<script src="https://unpkg.com/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"><\/script>')</script>
<script src="config.js?v=4"></script><script src="app.js?v=4"></script></body></html>
